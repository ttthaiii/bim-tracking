name: Deploy Cloud Functions

# Auto-deploy the Cloud Functions whenever code under functions/ is pushed to main.
# Hosting is handled separately by Firebase App Hosting (console GitHub link) — not here.
on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-functions.yml'
  # Allow a manual run from the Actions tab (useful for the first test / re-deploy).
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Authenticate to Google Cloud with a service-account key stored as a GitHub Secret.
      # This action writes the key to a file and sets GOOGLE_APPLICATION_CREDENTIALS,
      # which firebase-tools picks up automatically (no `firebase login` needed).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Install dependencies from the lockfile and compile TypeScript -> lib/.
      - name: Install and build functions
        run: |
          npm --prefix functions ci
          npm --prefix functions run build

      - name: Deploy functions to Firebase
        run: npx firebase-tools deploy --only functions --project bim-tracking --non-interactive
